<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Christmas List</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Caveat:wght@400;700&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">


    <!-- CSS -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="outer-box">
        <div class="container">

            <div class="header-box">
                <h1>My Christmas List</h1>
            </div>

            <div class="input-group">
                <label for="item-input">Enter an item</label>

                <div>
                    <input type="text" id="item-input" placeholder="E.g. Socks">
                    <button id="add-item-button">Add Item</button>
                </div>
            </div>

            <ul id="shopping-list" aria-live="polite"></ul>

        </div>
    </div>

    <!-- JS -->
  
    <script type="module" src="index.js"></script>
</body>

</html>
